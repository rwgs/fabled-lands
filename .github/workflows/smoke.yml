name: Smoke test

# Runs the headless smoke suite (web/_test.html) on every push and pull request.
# The suite exercises the rules engine and renders every section of all six books,
# so a regression that would only show up in the browser is caught in CI instead
# of shipping silently. No build toolchain is introduced — just Python's stdlib
# HTTP server and the Chrome that ubuntu-latest ships preinstalled.

on:
  push:
  pull_request:

jobs:
  # Guards the build scripts against the encoding trap that made build-data.ps1
  # unusable under Windows PowerShell 5.1 (task 121): a non-ASCII byte in the .ps1
  # source (an em dash in a double-quoted string) is misread through 5.1's legacy
  # code page and breaks parsing. That part is a pure source check over every build/*.ps1; the
  # job then runs the source-XML gate's own self-test (task 199). The build itself is executed,
  # and its output verified, by the `smoke` job below (task 197).
  build-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scripts stay ASCII-only and pin pwsh 7
        run: |
          set -euo pipefail
          fail=0
          for f in build/*.ps1; do
            if grep -nP '[^\x00-\x7F]' "$f"; then
              echo "✗ $f contains non-ASCII bytes (breaks Windows PowerShell 5.1 parsing)."
              fail=1
            fi
            if ! grep -q '^#Requires -Version 7.0' "$f"; then
              echo "✗ $f is missing the '#Requires -Version 7.0' guard."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ Build scripts are ASCII-only and require pwsh 7."

      # The source-XML gate, driven over mutation fixtures in a temp dir (task 199). The real
      # corpus is clean, so a gate that quietly stopped catching typos would look identical to
      # a passing build; this proves each class of mistake still fails. Touches no repo file.
      - name: The source-XML gate catches each class of mistake
        shell: pwsh
        run: ./build/validate-selftest.ps1

  # The DOM-free seam (task 195). AGENTS.md promises the rule modules import and run in plain
  # Node; a single stray import of a browser-touching module breaks that without failing the
  # browser suite, which has a DOM either way. Runs on Node's stdlib only — no npm install,
  # no DOM shim (a shim here would hide exactly what is being checked).
  rules-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rule modules import cleanly in Node (no DOM)
        run: node web/tests/node-import.mjs

  # Rebuilds the bundled data from books/ + rules/, checks the committed output still matches,
  # and only then serves what the build just produced. Before task 197 this job served
  # web/data straight from the checkout, which left two holes: build-data.ps1's 4,377-file XML
  # validation never ran (a malformed section could merge and first throw in a player's
  # browser), and nothing caught source/generated drift (an XML edit committed without a
  # rebuild left a stale bundle that CI then happily green-lit by testing the OLD sections).
  # pwsh 7 is preinstalled on the GitHub ubuntu images, so this adds no toolchain to the app
  # itself — the shipped web/ is still dependency-free.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Also stamps web/js/version.js and web/sw.js's cache key (it calls stamp-version.ps1).
      # Aborts here, naming the file, if any source XML is malformed or its <section name>
      # disagrees with its filename.
      - name: Rebuild the bundled data (pwsh 7)
        shell: pwsh
        run: ./build/build-data.ps1

      - name: Generated output matches its committed source
        run: |
          set -euo pipefail
          # Exactly what build-data.ps1 writes -- NOT all of web/assets, whose icons are
          # hand-committed source this build never touches (reporting one of those here would
          # tell the author to "rebuild and commit" for a change no rebuild can produce).
          # --untracked-files=all so a *new* generated file (a freshly added illustration, say)
          # counts as drift too, not just a modified one.
          GEN=(web/data web/assets/world-map.jpg web/assets/maps web/assets/illus
               web/js/version.js web/sw.js)
          DRIFT="$(git status --porcelain --untracked-files=all -- "${GEN[@]}")"
          if [ -n "$DRIFT" ]; then
            echo "✗ A clean rebuild changed generated files, so the committed output is stale."
            echo "  Fix: pwsh -ExecutionPolicy Bypass -File build/build-data.ps1 — then commit the result."
            echo "  (Never hand-edit web/data or version.js; change the XML and rebuild.)"
            echo "$DRIFT"
            git --no-pager diff --stat -- "${GEN[@]}"
            exit 1
          fi
          echo "✓ Bundled data, copied assets and build stamp match a clean rebuild."

      - name: Render every section headlessly
        run: |
          set -euo pipefail
          # Serve the repo root; _test.html loads ./js and ./data relative to /web/.
          python3 -m http.server 8848 --directory "$GITHUB_WORKSPACE" &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          # Wait for the server to accept connections before driving Chrome.
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:8848/web/_test.html -o /dev/null; then break; fi
            sleep 0.5
          done

          DOM="$(mktemp)"
          UDD="$(mktemp -d)"   # a fresh profile so no stale service-worker cache can serve an old bundle
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --no-first-run --no-default-browser-check \
            --dump-dom --virtual-time-budget=90000 \
            --user-data-dir="$UDD" \
            "http://localhost:8848/web/_test.html" > "$DOM" || true

          # Decide the verdict from the FIRST extracted result line only. --dump-dom
          # includes _test.html's inline script SOURCE, which carries the literal
          # "RESULT FATAL pass=0 fail=1" (the bootstrap's provisional-fatal string); a
          # whole-dump `grep -q 'RESULT FATAL'` therefore matched on every genuinely
          # failing run and misreported an ordinary assertion failure as a bootstrap
          # abort. The live verdict lives in <pre id="results"> at the very top of
          # <body>, so it is always the first match; the source literal only wins when
          # #results never populated — a true hang, correctly a FATAL. (task 142)
          echo "----- result -----"
          RESULT_LINE="$(grep -oE 'RESULT (ALL PASS|FAILURES|FATAL) pass=[0-9]+ fail=[0-9]+' "$DOM" | head -1 || true)"
          echo "${RESULT_LINE:-(no RESULT line — the suite did not run)}"
          case "$RESULT_LINE" in
            "RESULT ALL PASS"*)
              echo "✓ Smoke suite passed." ;;
            "RESULT FATAL"*)
              echo "✗ Smoke suite aborted before running (module parse/bootstrap error, e.g. a duplicate top-level const):"
              grep -oE 'FATAL [^<]{0,160}' "$DOM" | head -2 || true
              exit 1 ;;
            "RESULT FAILURES"*)
              echo "✗ Smoke suite failed. First FAIL lines:"
              grep -oE 'FAIL [^<]{0,160}' "$DOM" | head -50 || true
              exit 1 ;;
            *)
              echo "✗ No RESULT line — the suite did not run (server down, wrong path, or a hang)."
              exit 1 ;;
          esac
